[project]
name = "aris-server"
version = "0.1.0"
description = "Run open-weight models locally behind the Anthropic Messages API, for Claude Code and friends."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# mlx-lm is pinned exactly: Aris Server drives its server internals (ResponseGenerator, ModelProvider).
dependencies = ["mlx-lm==0.32.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aris-server = "aris_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aris_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
